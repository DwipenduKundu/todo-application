<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f7f4, #eef2ff);
        }

        .email-container {
            width: 90%;
            max-width: 430px;
            padding: 45px 35px;
            background: #ffffff;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        .email-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #ccfbf1;
            color: #0d9488;
            font-size: 35px;
        }

        h2 {
            color: #1e293b;
            font-size: 25px;
            margin-bottom: 14px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .login-btn {
            display: inline-block;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #115e59;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .email-container {
                padding: 35px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="email-container">

        <div class="email-icon">✉</div>

        <h2>Check Your Email</h2>

        <p>
            If an account exists with that email,
            you will receive a password reset link.
            Please check your inbox and spam folder.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            Back to Login →
        </a>

    </div>

</body>
</html>
