
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #e0f7f4, #eef2ff);
        }

        .wrapper {
            background: #ffffff;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #ccfbf1;
            color: #0d9488;
            font-size: 35px;
        }

        h2 {
            color: #1e293b;
            font-size: 25px;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            margin: 10px 0 18px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #115e59;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #0d9488;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #115e59;
        }

        .errorlist {
            list-style: none;
            color: #dc2626;
            font-size: 13px;
            text-align: left;
            margin-bottom: 8px;
        }

        @media (max-width: 480px) {
            .wrapper {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <div class="icon">🔐</div>

        <h2>Forgot Password?</h2>

        <p class="description">
            Don't worry! Enter your registered email address
            and we'll send you a link to reset your password.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.email.errors }}

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button type="submit">
                Send Reset Link →
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-link">
            ← Back to Login
        </a>

    </div>

</body>
</html>
