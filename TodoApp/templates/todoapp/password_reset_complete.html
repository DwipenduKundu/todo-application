<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f7f4, #eef2ff);
        }

        .success-container {
            width: 90%;
            max-width: 420px;
            padding: 45px 35px;
            background: #ffffff;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            font-size: 38px;
            font-weight: bold;
        }

        h2 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .login-btn {
            display: inline-block;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #115e59;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .success-container {
                padding: 35px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="success-icon">✓</div>

        <h2>Password Changed!</h2>

        <p>
            Your password has been successfully updated.
            You can now log in using your new password.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            Login Now →
        </a>

    </div>

</body>
</html>
