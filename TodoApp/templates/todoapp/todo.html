{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To Do App</title>

    <!-- Bablic Script -->
    <script src="//d.bablic.com/snippet/6288d4c3c4c5800001a91242.js?version=3.9"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- External Custom CSS -->
    <link rel="stylesheet" href="{% static 'todoapp/css/todo.css' %}">

</head>

<body>

    <section class="vh-100" style="background-color: #eee">

        <div class="container py-5 h-100">

            <div class="row d-flex justify-content-center align-items-center h-100">

                <div class="col col-lg-9 col-xl-7">

                    <div class="card rounded-3">

                        <div class="card-body p-4">

                            <h4 class="text-center my-3 pb-3">
                                To Do App
                            </h4>

                            <!-- Add Task Form -->
                            <form method="POST"
                                class="row row-cols-lg-auto g-3 justify-content-center align-items-center mb-4 pb-2">

                                {% csrf_token %}

                                <div class="col-12">
                                    <div class="form-outline">
                                        <input
                                            type="text"
                                            id="form1"
                                            class="form-control"
                                            name="task"
                                            placeholder="Enter a task here"
                                        />
                                    </div>
                                </div>

                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary">
                                        Add Task
                                    </button>
                                </div>

                            </form>

                            <!-- Logout Button -->
                            <a href="{% url 'logout' %}"
                                class="btn btn-primary"
                                style="background: firebrick; color: white;">

                                Logout

                            </a>

                            <!-- Todo Table -->
                            <table class="table mb-4">

                                <thead>
                                    <tr>
                                        <th scope="col">Todo item</th>
                                        <th scope="col">Status</th>
                                        <th scope="col">Actions</th>
                                    </tr>
                                </thead>

                                <tbody>

                                    {% for i in todos %}

                                    <tr class="{% if i.status %}completed-task{% else %}progress-task{% endif %}">

                                        <!-- Task Name -->
                                        <td class="task-title">
                                            {{ i.todo_name }}
                                        </td>

                                        <!-- Task Status -->
                                        {% if i.status %}

                                            <td>
                                                <span class="badge bg-success">
                                                    Completed
                                                </span>
                                            </td>

                                        {% else %}

                                            <td>
                                                <span class="badge bg-warning text-dark">
                                                    In progress
                                                </span>
                                            </td>

                                        {% endif %}

                                        <!-- Task Actions -->
                                        <td>

                                            <a href="{% url 'delete' i.id %}">
                                                <button type="button" class="btn btn-danger">
                                                    Delete
                                                </button>
                                            </a>

                                            {% if i.status %}

                                                <a href="{% url 'update' i.id %}">
                                                    <button type="button" class="btn btn-warning ms-1">
                                                        Unfinished
                                                    </button>
                                                </a>

                                            {% else %}

                                                <a href="{% url 'update' i.id %}">
                                                    <button type="button" class="btn btn-success ms-1">
                                                        Finished
                                                    </button>
                                                </a>

                                            {% endif %}

                                        </td>

                                    </tr>

                                    {% endfor %}

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
